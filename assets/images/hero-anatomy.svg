<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Agent Design and Application overview">
  <defs>
    <style>
      .ink { fill: #1c1917; }
      .muted { fill: #57534e; }
      .accent { fill: #b45309; }
      .paper { fill: #fafaf9; }
      .soft { fill: #f5f5f4; }
      .stroke-ink { stroke: #1c1917; }
      .stroke-line { stroke: #e7e5e4; }
      .stroke-accent { stroke: #b45309; }
      text { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .t-title { font-size: 18px; font-weight: 700; fill: #1c1917; }
      .t-label { font-size: 13px; fill: #57534e; }
      .t-accent { font-size: 13px; font-weight: 600; fill: #b45309; }
      .t-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #1c1917; }
    </style>
  </defs>

  <!-- background card -->
  <rect x="8" y="8" width="544" height="404" rx="14" fill="#fafaf9" stroke="#e7e5e4"/>

  <!-- Title -->
  <text x="32" y="50" class="t-title">Agent Anatomy</text>
  <text x="32" y="70" class="t-label">模型 · 工具 · 记忆 · 规划 · 行动 · 反思</text>

  <!-- central node: Model -->
  <circle cx="280" cy="220" r="58" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="280" y="216" text-anchor="middle" class="t-accent" style="font-size: 15px;">LLM</text>
  <text x="280" y="234" text-anchor="middle" class="t-label">大脑</text>

  <!-- surrounding nodes -->
  <!-- Tools -->
  <rect x="60" y="180" width="120" height="68" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="120" y="208" text-anchor="middle" class="t-mono">Tools</text>
  <text x="120" y="228" text-anchor="middle" class="t-label">函数 / API / 代码</text>

  <!-- Memory -->
  <rect x="380" y="180" width="120" height="68" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="440" y="208" text-anchor="middle" class="t-mono">Memory</text>
  <text x="440" y="228" text-anchor="middle" class="t-label">短期 / 长期 / 向量</text>

  <!-- Plan (top) -->
  <rect x="220" y="60" width="120" height="56" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="280" y="84" text-anchor="middle" class="t-mono">Plan</text>
  <text x="280" y="102" text-anchor="middle" class="t-label">ReAct · Plan-Execute</text>

  <!-- Action (bottom-left) -->
  <rect x="100" y="320" width="120" height="56" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="160" y="344" text-anchor="middle" class="t-mono">Action</text>
  <text x="160" y="362" text-anchor="middle" class="t-label">调用 / 写入 / 询问</text>

  <!-- Reflect (bottom-right) -->
  <rect x="340" y="320" width="120" height="56" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
  <text x="400" y="344" text-anchor="middle" class="t-mono">Reflect</text>
  <text x="400" y="362" text-anchor="middle" class="t-label">自检 · 重试 · 评估</text>

  <!-- edges -->
  <line x1="180" y1="214" x2="222" y2="218" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="338" y1="218" x2="380" y2="214" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="280" y1="162" x2="280" y2="116" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="252" y1="262" x2="180" y2="320" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="308" y1="262" x2="400" y2="320" stroke="#1c1917" stroke-width="1.2"/>

  <!-- footer caption -->
  <text x="32" y="395" class="t-label">一个 Agent = 一个能思考、能调用工具、能记住上下文的循环</text>
</svg>
